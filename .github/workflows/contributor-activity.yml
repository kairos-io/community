name: Contributor activity

# Refresh the "Last activity" column in CONTRIBUTORS.md once a month, and on
# demand. Opens/updates a PR with the result (main is protected, so the bot
# cannot push directly — the monthly PR review doubles as the human checkpoint
# for the GOVERNANCE.md off-boarding process).
on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh last-activity column
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_activity.py

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          # Attribute the commit to the automation that makes it. Left unset,
          # the action defaults the author to github.actor, which on this
          # schedule is whoever last edited this workflow, so a generated tree
          # gets credited to a human who never saw it.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # The DCO app gates this repository and compares the trailer to the
          # commit's own author, so the sign-off has to name the identity set
          # above. Without it every monthly pull request opens red and only
          # lands if a maintainer merges past the check.
          commit-message: |
            chore: refresh contributor last-activity

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "chore: refresh contributor last-activity"
          body: |
            Automated monthly refresh of the **Last activity** column in
            `CONTRIBUTORS.md`.

            Recency is the most recent action each contributor took
            themselves across the public `kairos-io` org: opening an issue or
            pull request, commenting on one, reviewing one, or authoring a
            commit. Being mentioned or assigned by someone else does not
            count. See `GOVERNANCE.md` for the off-boarding guidance this
            supports.

            _This PR is regenerated each run; no manual edits needed._
          branch: chore/contributor-activity
          delete-branch: true
          add-paths: CONTRIBUTORS.md
